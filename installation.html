<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AS WE SEE</title>
<style>
:root { color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
.hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
#bg-three { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
#bg-three canvas { display: block; pointer-events: none !important; }
</style>
</head>
<body>
<section class="hero"><div id="bg-three"></div></section>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
const PARTICLES = 68000, PORTRAIT = 38000, MIN_GRAY = 0.18, PARTICLE_SIZE = 0.47, CONTRAST = 1.08,
      GLOBAL_ROTATE_SPEED = 0.1, PORTRAIT_SCALE = 1.44, PORTRAIT_Y_SHIFT = -40, MORPH_TIME = 30000, PORTRAIT_SCALE_FACTOR = 1.15;
const POSITION_SMOOTH = 0.09;
const PORTRAIT_LIST = [
  "images/portrait.png", "images/portrait-1.png", "images/portrait-2.png",
  "images/portrait-3.png", "images/portrait-4.png", "images/portrait-5.png"
];
const HOLD_TIME = 12000, RELEASE_TIME = 18000;
let portraitIdx = 0, swapping = false;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x10151A, 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio || 1);
document.getElementById("bg-three").appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(400, 80, 220); camera.lookAt(0,0,0);
const scene = new THREE.Scene();

const positions = new Float32Array(PARTICLES * 3),
      basePositions = new Float32Array(PARTICLES * 3),
      morphTargets = new Float32Array(PARTICLES * 3),
      colors = new Float32Array(PARTICLES * 3),
      sizes = new Float32Array(PARTICLES),
      sharpness = new Float32Array(PARTICLES),
      isPortrait = new Uint8Array(PARTICLES);

function clamp(v,a,b){return Math.max(a,Math.min(v,b));}
function applyContrast(l, c) { return clamp(0.5 + (l-0.5)*c, 0, 1); }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

const RADIUS = 700;
for(let i=0;i<PARTICLES;++i){
  let r = RADIUS * (0.7 + Math.random()*0.2) * (Math.random()**0.6),
      theta = Math.random()*2*Math.PI,
      phi = Math.acos(1 - 2*Math.random());
  const x = r*Math.sin(phi)*Math.cos(theta)+150,
        y = r*Math.sin(phi)*Math.sin(theta)+80,
        z = r*Math.cos(phi)-150;
  positions[i*3] = basePositions[i*3] = x;
  positions[i*3+1] = basePositions[i*3+1] = y;
  positions[i*3+2] = basePositions[i*3+2] = z;
  colors[i*3] = colors[i*3+1] = colors[i*3+2] = 1.0;
  sizes[i] = PARTICLE_SIZE; sharpness[i] = 1.0; isPortrait[i] = 0;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));

const material = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    attribute vec3 color;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      float sz = aSize * 1300.0 / max(1.0, -mvPosition.z);
      gl_PointSize = max(1.0, sz);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float border = 0.07;
      if(gl_PointCoord.x < border || gl_PointCoord.x > 1.0-border ||
         gl_PointCoord.y < border || gl_PointCoord.y > 1.0-border) discard;
      gl_FragColor = vec4(vColor, 0.99);
    }
  `,
  transparent: true,
  depthTest: false,
  depthWrite: false
});

const points = new THREE.Points(geometry, material);
points.frustumCulled = false;
scene.add(points);

function sampleImageGrid(url, pointCount, callback) {
const img = new Image();
img.crossOrigin = "anonymous";

function hardFallback() {
  const out=[], lums=[], sharpArr=[];
  const R=170;
  for (let i=0; i<pointCount; i++){
    const th = Math.random()*Math.PI*2, r  = Math.sqrt(Math.random())*R;
    const x = r*Math.cos(th), y = r*Math.sin(th);
    const nx = (x/320) * 280 * PORTRAIT_SCALE;
    const ny = (-y/400) * 340 * PORTRAIT_SCALE + PORTRAIT_Y_SHIFT;
    const radial = Math.hypot(x/(320*0.9), y/(400*0.9));
    const sharp = Math.max(0.4, 1.0 - radial);
    out.push({x:nx, y:ny, z:0, sharp}); lums.push(0.8); sharpArr.push(sharp);
  }
  callback(out, lums, sharpArr);
}
img.onerror = hardFallback;

img.onload = function(){
  const w = 480, h = 600;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');

  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const arI = iw/ih, arC = w/h;
  let dw=w, dh=h, dx=0, dy=0;
  if (arI > arC) { dh = Math.round(w/arI); dy = Math.floor((h-dh)/2); }
  else           { dw = Math.round(h*arI); dx = Math.floor((w-dw)/2); }
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img, dx, dy, dw, dh);

  let data; try { data = ctx.getImageData(0,0,w,h).data; } catch(e){ return hardFallback(); }

  const ALPHA_THRESH = 0.10;
  const L = new Float32Array(w*h);
  for (let i=0, y=0; y<h; y++){
    for (let x=0; x<w; x++, i++){
      const k=i*4;
      const a = data[k+3]/255;
      const lum = (data[k]*0.299 + data[k+1]*0.587 + data[k+2]*0.114)/255;
      const keep = (a >= ALPHA_THRESH) ? 1.0 : (lum > 0.25 ? 0.5 : 0.0);
      L[i] = keep ? Math.max(MIN_GRAY, lum) : 0.0;
    }
  }

  const E = new Float32Array(w*h);
  const g=(xx,yy)=> {
    xx = Math.max(0,Math.min(w-1,xx));
    yy = Math.max(0,Math.min(h-1,yy));
    return L[yy*w+xx];
  };
  for (let y=0; y<h; y++){
    for (let x=0; x<w; x++){
      const gx = -g(x-1,y-1)-2*g(x-1,y)-g(x-1,y+1) + g(x+1,y-1)+2*g(x+1,y)+g(x+1,y+1);
      const gy = -g(x-1,y-1)-2*g(x,y-1)-g(x+1,y-1) + g(x-1,y+1)+2*g(x,y+1)+g(x+1,y+1);
      E[y*w+x] = Math.min(1, Math.hypot(gx,gy)*0.9);
    }
  }

  const EDGE_W=0.60, MID_W=0.30, LUM_W=0.10;
  const S = new Float32Array(w*h);
  let Ssum = 0;
  for (let i=0;i<w*h;i++){
    const l = L[i];
    if (l === 0){ S[i]=0; continue; }
    const mid = 1.0 - Math.abs(l - 0.5);
    const s = EDGE_W*E[i] + MID_W*mid + LUM_W*Math.min(1.0, l*1.2);
    S[i] = s; Ssum += s;
  }
  if (Ssum <= 0) return hardFallback();

  const cellsX = Math.max(16, Math.round(Math.sqrt(pointCount * (w/h))*0.95));
  const cellsY = Math.max(16, Math.round(pointCount / cellsX));
  const cellW = w / cellsX, cellH = h / cellsY;

  const cellCands = new Array(cellsX*cellsY);
  const cellScore = new Float32Array(cellsX*cellsY);
  const cellMask  = new Uint32Array(cellsX*cellsY);
  for (let i=0;i<cellCands.length;i++){ cellCands[i]=[]; cellScore[i]=0; cellMask[i]=0; }

  for (let y=0; y<h; y++){
    for (let x=0; x<w; x++){
      const i = y*w+x;
      if (L[i] <= 0) continue;
      const cx = Math.min(cellsX-1, Math.floor(x/cellW));
      const cy = Math.min(cellsY-1, Math.floor(y/cellH));
      const idx = cy*cellsX + cx;
      cellCands[idx].push({x, y, s:S[i], l:L[i]});
      cellScore[idx] += S[i];
      cellMask[idx]  += 1;
    }
  }

  let activeCells = 0; for (let i=0;i<cellMask.length;i++) if (cellMask[i]>0) activeCells++;
  if (!activeCells) return hardFallback();

  const alloc = new Int32Array(cellsX*cellsY);
  let allocated = 0;
  for (let i=0;i<alloc.length;i++){
    if (cellMask[i]>0){ alloc[i] = 1; allocated++; }
  }
  let remain = Math.max(0, pointCount - allocated);
  let scoreSumActive = 0; for (let i=0;i<cellScore.length;i++) if (cellMask[i]>0) scoreSumActive += Math.max(1e-6, cellScore[i]);

  for (let i=0;i<alloc.length && remain>0;i++){
    if (cellMask[i]===0) continue;
    const want = Math.floor((cellScore[i]/scoreSumActive) * remain);
    alloc[i] += Math.min(want, Math.max(0, cellCands[i].length - alloc[i]));
  }
  allocated = 0; for (let i=0;i<alloc.length;i++) allocated += alloc[i];

  let leftover = pointCount - allocated;
  if (leftover > 0){
    const order = [...Array(alloc.length).keys()].sort((a,b)=>cellScore[b]-cellScore[a]);
    let k=0;
    while (leftover>0 && k<order.length*4){
      const i = order[k % order.length];
      if (cellMask[i]>0 && alloc[i] < cellCands[i].length){ alloc[i]++; leftover--; }
      k++;
    }
  }

  const out=[], lums=[], sharpArr=[];
  const centerX = w/2, centerY = h/2, JIT=0.35;

  for (let idx=0; idx<cellCands.length; idx++){
    const want = alloc[idx]; if (want<=0) continue;
    const list = cellCands[idx];
    if (!list.length) continue;
    list.sort((a,b)=>b.s - a.s);

    for (let k=0; k<want && k<list.length; k++){
      const c = list[k];
      const jx = (Math.random()-0.5)*cellW*JIT;
      const jy = (Math.random()-0.5)*cellH*JIT;
      const px = clamp(c.x + jx, 0, w-1);
      const py = clamp(c.y + jy, 0, h-1);

      const nx = (px - centerX)/w * 280 * PORTRAIT_SCALE;
      const ny = (centerY - py)/h * 340 * PORTRAIT_SCALE + PORTRAIT_Y_SHIFT;

      const dx = (px-centerX)/(w/2), dy=(py-centerY)/(h/2);
      const radial = Math.hypot(dx, dy);
      const sharp = Math.max(0.4, 1.0 - radial);

      out.push({x:nx, y:ny, z:0, sharp});
      lums.push(Math.max(MIN_GRAY, c.l));
      sharpArr.push(sharp);
    }
  }

  if (out.length < pointCount){
    const deficit = pointCount - out.length;
    const pool = [];
    for (let i=0;i<cellCands.length;i++){
      const list = cellCands[i];
      for (let k=alloc[i]; k<list.length; k++) pool.push(list[k]);
    }
    pool.sort((a,b)=>b.s - a.s);
    for (let m=0; m<deficit && m<pool.length; m++){
      const c = pool[m], px=c.x, py=c.y;
      const nx = (px - centerX)/w * 280 * PORTRAIT_SCALE;
      const ny = (centerY - py)/h * 340 * PORTRAIT_SCALE + PORTRAIT_Y_SHIFT;
      const dx = (px-centerX)/(w/2), dy=(py-centerY)/(h/2);
      const radial = Math.hypot(dx, dy);
      const sharp = Math.max(0.4, 1.0 - radial);
      out.push({x:nx,y:ny,z:0,sharp}); lums.push(Math.max(MIN_GRAY, c.l)); sharpArr.push(sharp);
    }
  }

  if (out.length > pointCount){
    out.length = pointCount; lums.length = pointCount; sharpArr.length = pointCount;
  }
  callback(out, lums, sharpArr);
};

img.src = url;
}

let morphLums = [], sharpArr = [], morphStartTime = 0, morphing = false, morphReady = false, fullyReady = false;
let portraitIndices = [];

function rotateY(x, y, z, theta) { return [Math.cos(theta)*x - Math.sin(theta)*z, y, Math.sin(theta)*x + Math.cos(theta)*z]; }
function rotateX(x, y, z, phi) { return [x, Math.cos(phi)*y - Math.sin(phi)*z, Math.sin(phi)*y + Math.cos(phi)*z]; }
function rotateAroundPoint(x, y, z, cx, cy, cz, theta, phi) {
  let dx = x - cx, dy = y - cy, dz = z - cz;
  let [rx, ry, rz] = rotateY(dx, dy, dz, theta); [rx, ry, rz] = rotateX(rx, ry, rz, phi);
  return [rx + cx, ry + cy, rz + cz];
}

requestAnimationFrame(animate);

function startMorph(){
  portraitIndices = Array.from({length: PORTRAIT}, (_,i)=>i);
  for(let i=0; i<PARTICLES; i++) isPortrait[i]=0;
  for(const idx of portraitIndices) isPortrait[idx]=1;

  sampleImageGrid(PORTRAIT_LIST[portraitIdx % PORTRAIT_LIST.length], PORTRAIT, function(samples, lums, sharps){
    morphLums = lums; sharpArr = sharps;
    for(let i=0;i<PARTICLES;++i){
      if(isPortrait[i]){
        const pi = portraitIndices.indexOf(i);
        const forward = new THREE.Vector3(); camera.getWorldDirection(forward).normalize();
        const portraitDepth = 320;
        const portraitCenter = camera.position.clone().add(forward.multiplyScalar(portraitDepth));
        const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
        const pos = portraitCenter.clone()
          .add(right.multiplyScalar(samples[pi].x))
          .add(camera.up.clone().multiplyScalar(samples[pi].y));
        morphTargets[i*3]=pos.x; morphTargets[i*3+1]=pos.y; morphTargets[i*3+2]=pos.z;
        sharpness[i] = sharps[pi];
      } else {
        morphTargets[i*3]=basePositions[i*3];
        morphTargets[i*3+1]=basePositions[i*3+1];
        morphTargets[i*3+2]=basePositions[i*3+2];
        sharpness[i]=1.0;
      }
    }
    morphStartTime = -1;
    swapping = false;
    morphReady = true; morphing = true; fullyReady = true;
    const cnv = document.querySelector("#bg-three canvas"); if(cnv) cnv.style.display = "block";
  });
}

function animate(now){
  const t = now*0.001, globalPhase = t*GLOBAL_ROTATE_SPEED;
  let morphPhase = 0;
  if(fullyReady && morphReady && morphing){
    if(morphStartTime < 0) morphStartTime = now;
    const el = now - morphStartTime;
    if(el < MORPH_TIME){
      morphPhase = easeInOut(Math.min(1, el/MORPH_TIME));
    } else if(el < MORPH_TIME + HOLD_TIME){
      morphPhase = 1;
    } else if(el < MORPH_TIME + HOLD_TIME + RELEASE_TIME){
      morphPhase = easeInOut(1 - (el - MORPH_TIME - HOLD_TIME)/RELEASE_TIME);
    } else {
      morphPhase = 0;
      if(!swapping){ swapping = true; portraitIdx++; startMorph(); }
    }
  }
  for(let i=0; i<PARTICLES; ++i){
    let bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2], gx = bx, gy = by, gz = bz;
    if (!isPortrait[i]) { [gx, gy, gz] = rotateAroundPoint(bx, by, bz, 0, 0, 0, globalPhase, globalPhase * 0.7); }
    const orbMag = 6.5 + (isPortrait[i]?0.8:0), orbFreq = 0.26 + (i%17)*0.007,
          wob = Math.sin(t*orbFreq + i) * orbMag, wob2 = Math.cos(t*orbFreq*0.63 + i*0.74) * (orbMag*0.5);
    let nx, ny, nz;
    if(fullyReady && morphReady && morphing && isPortrait[i]){
      const tx = morphTargets[i*3], ty = morphTargets[i*3+1], tz = morphTargets[i*3+2];
      if (morphPhase < 1.0) { nx = (1-morphPhase)*bx + morphPhase*tx + wob; ny = (1-morphPhase)*by + morphPhase*ty + wob2; nz = (1-morphPhase)*bz + morphPhase*tz; }
      else { nx = tx + wob; ny = ty + wob2; nz = tz; }
      let sharp = sharpness[i], lum = applyContrast(morphLums[portraitIndices.indexOf(i)] ?? 0.8, CONTRAST);
      lum = clamp(lum, MIN_GRAY, 1.0);
      sizes[i] = PARTICLE_SIZE * sharp * (morphPhase>0.999 ? PORTRAIT_SCALE_FACTOR : 1.0);
      colors[i*3] = colors[i*3+1] = colors[i*3+2] = 1.0 + (lum-1.0)*morphPhase;
    } else {
      nx = gx + wob; ny = gy + wob2; nz = gz;
      colors[i*3]=colors[i*3+1]=colors[i*3+2]=1.0;
      sizes[i]=PARTICLE_SIZE;
    }
    positions[i*3]   += (nx - positions[i*3])   * POSITION_SMOOTH;
    positions[i*3+1] += (ny - positions[i*3+1]) * POSITION_SMOOTH;
    positions[i*3+2] += (nz - positions[i*3+2]) * POSITION_SMOOTH;
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;
  geometry.attributes.aSize.needsUpdate = true;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

startMorph();
</script>

<audio id="narration-audio" src="narration-aswesee-ok.mp3" autoplay></audio>
<script>
(function(){
  const a = document.getElementById('narration-audio');
  if (a) a.play().catch(function(){});
})();
</script>

</body>
</html>
